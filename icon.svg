<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#162a45"/>
    </linearGradient>
    <linearGradient id="flame" x1="128" y1="205" x2="128" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="core" x1="128" y1="188" x2="128" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bolt" x1="148" y1="68" x2="116" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>

  <!-- Subtle inner rim -->
  <rect x="3" y="3" width="250" height="250" rx="42" fill="none"
        stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Flame outer shape -->
  <path d="M128 205
    C 82 205 60 178 60 148
    C 60 118 84 98 108 80
    C 100 100 108 114 122 112
    C 116 88 122 58 128 50
    C 134 58 140 88 134 112
    C 148 114 156 100 148 80
    C 172 98 196 118 196 148
    C 196 178 174 205 128 205 Z"
    fill="url(#flame)" filter="url(#glow)"/>

  <!-- Flame inner luminous core -->
  <path d="M128 188
    C 108 188 96 172 96 156
    C 96 142 106 130 118 122
    C 116 134 124 144 132 140
    C 128 126 136 110 142 106
    C 140 118 150 130 158 122
    C 154 138 162 154 154 164
    C 156 150 166 140 164 128
    C 172 142 170 162 162 172
    C 154 186 142 192 128 188 Z"
    fill="url(#core)"/>

  <!-- Lightning bolt (smart optimization) -->
  <polygon
    points="148,68 128,116 142,116 116,190 148,130 134,130 164,68"
    fill="url(#bolt)" opacity="0.92"/>
</svg>
